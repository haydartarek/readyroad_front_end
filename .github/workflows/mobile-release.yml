name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RIJVIA_API_BASE_URL: https://api.rijvia.be

jobs:
  build-android:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$RIJVIA_API_BASE_URL"

      - name: Build Android App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$RIJVIA_API_BASE_URL"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.sha }}
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ github.sha }}
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build unsigned iOS application
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$RIJVIA_API_BASE_URL"

      - name: Upload unsigned iOS application
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-${{ github.sha }}
          path: mobile_app/build/ios/iphoneos/Runner.app
          retention-days: 30
