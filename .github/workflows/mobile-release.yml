name: Mobile Release Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-release.yml"
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Show Dart version
        run: dart --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.sha }}
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Build Android APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: flutter build appbundle --release

      - name: Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.sha }}
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ github.sha }}
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS build
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-${{ github.sha }}
          path: mobile_app/build/ios/archive/Runner.xcarchive
          retention-days: 30

      - name: Build notes
        run: |
          echo "iOS build complete (unsigned)"
          echo "For signed IPA, run: flutter build ipa --release"
          echo "Requires Apple Developer account and proper code signing setup"
