name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Must be X.Y.Z (for example, 1.0.0)"
            exit 1
          fi

      - name: Check if tag exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            printf '## ReadyRoad v%s\n\n' "$VERSION"
            printf '%s\n\n' "$RELEASE_NOTES"
            printf '### Components\n'
            printf '%s\n' '- Web App (Next.js 16)'
            printf '%s\n' '- Mobile App (Flutter 3.38.5)'
            printf '\n### Artifacts\n'
            printf '%s\n' '- Android APK and AAB: Mobile Release workflow artifacts'
            printf '%s\n' '- Unsigned iOS application: Mobile Release workflow artifacts'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create and push git tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "ReadyRoad v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Trigger Mobile Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run mobile-release.yml \
            --ref "v$VERSION" \
            -f version="$VERSION"
