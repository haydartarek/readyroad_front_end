name: Deploy Production

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Verified Backend main commit (full SHA)
        required: true
        type: string
      frontend_ref:
        description: Verified Frontend main commit (full SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rijvia-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified commits to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    env:
      VPS_HOST: "187.127.232.106"
      VPS_PORT: "22"
      VPS_USER: "readyroad-ci"

    steps:
      - name: Resolve deployment intent
        id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          FRONTEND_INPUT: ${{ inputs.frontend_ref }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            frontend_ref="$FRONTEND_INPUT"
            [[ "$frontend_ref" =~ ^[0-9a-f]{40}$ ]]

            printf 'should_deploy=true\n' >>"$GITHUB_OUTPUT"
            printf 'mode=manual\n' >>"$GITHUB_OUTPUT"
            printf 'frontend_ref=%s\n' "$frontend_ref" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          frontend_ref="$TRIGGER_SHA"
          [[ "$frontend_ref" =~ ^[0-9a-f]{40}$ ]]

          latest_main="$(
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/haydartarek/readyroad_front_end/commits/main" \
              | jq --exit-status --raw-output '.sha'
          )"

          [[ "$latest_main" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$frontend_ref" != "$latest_main" ]]; then
            echo "Skipping stale Web CI completion."
            echo "Trigger SHA : $frontend_ref"
            echo "Current main: $latest_main"

            printf 'should_deploy=false\n' >>"$GITHUB_OUTPUT"
            printf 'mode=automatic\n' >>"$GITHUB_OUTPUT"
            printf 'frontend_ref=%s\n' "$frontend_ref" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'should_deploy=true\n' >>"$GITHUB_OUTPUT"
          printf 'mode=automatic\n' >>"$GITHUB_OUTPUT"
          printf 'frontend_ref=%s\n' "$frontend_ref" >>"$GITHUB_OUTPUT"

      - name: Configure pinned SSH access
        if: steps.intent.outputs.should_deploy == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_KEY" ]] || {
            echo "VPS_DEPLOY_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          [[ -n "$KNOWN_HOSTS" ]] || {
            echo "VPS_KNOWN_HOSTS is not configured" >&2
            exit 1
          }

          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/rijvia-deploy"
          printf '%s\n' "$DEPLOY_KEY" >"$HOME/.ssh/rijvia-deploy"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"

      - name: Resolve and verify Backend and Frontend commits
        id: refs
        if: steps.intent.outputs.should_deploy == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_INPUT: ${{ inputs.backend_ref }}
          FRONTEND_REF: ${{ steps.intent.outputs.frontend_ref }}
        run: |
          set -Eeuo pipefail

          verify_ci() {
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$1/actions/workflows/$2/runs?branch=main&event=push&head_sha=$3&per_page=1" \
              | jq --exit-status --arg sha "$3" \
                '.workflow_runs[0] | .head_sha == $sha and .status == "completed" and .conclusion == "success"' >/dev/null
          }

          release_pair() {
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$1/commits/$2" \
              | jq --exit-status --raw-output \
                '.commit.message | split("\n") | map(select(startswith("Release-Pair:"))) | if length > 1 then error("Multiple release pairs") else .[0] // "" end'
          }

          frontend_ref="$FRONTEND_REF"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend_ref="$BACKEND_INPUT"
          else
            ssh_options=(
              -i "$HOME/.ssh/rijvia-deploy"
              -o BatchMode=yes
              -o IdentitiesOnly=yes
              -o StrictHostKeyChecking=yes
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
              -p "$VPS_PORT"
            )

            backend_ref="$(
              ssh "${ssh_options[@]}" \
                "${VPS_USER}@${VPS_HOST}" \
                'set -Eeuo pipefail
                 manifest=/opt/readyroad/current/release-manifest.env
                 test -r "$manifest"
                 grep -Fxq "DEPLOYMENT_STATUS=SUCCESS" "$manifest"
                 grep -Fxq "HEALTH_RESULT=PASSED" "$manifest"
                 sed -n "s/^BACKEND_GIT_COMMIT=//p" "$manifest" | head -n 1'
            )"
          fi

          [[ "$backend_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$frontend_ref" =~ ^[0-9a-f]{40}$ ]]

          verify_ci haydartarek/readyroad backend-ci.yml "$backend_ref"
          verify_ci haydartarek/readyroad_front_end web-ci.yml "$frontend_ref"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend_pair="$(release_pair haydartarek/readyroad "$backend_ref")"
            frontend_pair="$(release_pair haydartarek/readyroad_front_end "$frontend_ref")"

            [[ -n "$backend_pair" ]] || {
              echo "Backend commit is missing Release-Pair" >&2
              exit 1
            }

            [[ "$backend_pair" == "$frontend_pair" ]] || {
              echo "Backend and Frontend release pairs do not match" >&2
              exit 1
            }
          fi

          printf 'backend_ref=%s\n' "$backend_ref" >>"$GITHUB_OUTPUT"
          printf 'frontend_ref=%s\n' "$frontend_ref" >>"$GITHUB_OUTPUT"

      - name: Deploy through Gate 5D
        id: deploy
        if: steps.intent.outputs.should_deploy == 'true'
        shell: bash
        env:
          BACKEND_REF: ${{ steps.refs.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend_ref }}
        run: |
          set -Eeuo pipefail

          release_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BACKEND_REF:0:7}-${FRONTEND_REF:0:7}"
          ssh_options=(
            -i "$HOME/.ssh/rijvia-deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$VPS_PORT"
          )

          for attempt in 1 2 3 4; do
            set +e
            output="$(
              ssh "${ssh_options[@]}" \
                "${VPS_USER}@${VPS_HOST}" \
                "deploy ${BACKEND_REF} ${FRONTEND_REF} ${release_id}" 2>&1
            )"
            status=$?
            set -e
            printf '%s\n' "$output"

            if (( status == 0 )); then
              printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -Fq 'deployment_already_running' <<<"$output" &&
              (( attempt < 4 )); then
              sleep 90
              continue
            fi

            exit "$status"
          done

      - name: Verify public production smoke
        if: steps.intent.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --max-time 30 https://rijvia.be/ >/dev/null
          curl --fail --silent --show-error --location \
            --max-time 30 https://rijvia.be/robots.txt >/dev/null
          curl --fail --silent --show-error --location \
            --max-time 30 https://rijvia.be/sitemap.xml >/dev/null
          curl --fail --silent --show-error --location \
            --max-time 30 https://api.rijvia.be/actuator/health \
            | jq --exit-status '.status == "UP"' >/dev/null

      - name: Record deployment
        if: steps.intent.outputs.should_deploy == 'true'
        shell: bash
        env:
          RELEASE_ID: ${{ steps.deploy.outputs.release_id }}
          BACKEND_REF: ${{ steps.refs.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend_ref }}
          DEPLOY_MODE: ${{ steps.intent.outputs.mode }}
        run: |
          {
            echo "## RijVia production deployment"
            echo
            echo "- Mode: `$DEPLOY_MODE`"
            echo "- Release: `$RELEASE_ID`"
            echo "- Backend: `$BACKEND_REF`"
            echo "- Frontend: `$FRONTEND_REF`"
            echo "- Gate 5D: passed"
            echo "- Public smoke: passed"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Record stale-run skip
        if: steps.intent.outputs.should_deploy == 'false'
        shell: bash
        env:
          FRONTEND_REF: ${{ steps.intent.outputs.frontend_ref }}
        run: |
          {
            echo "## RijVia production deployment"
            echo
            echo "- Automatic deploy skipped"
            echo "- Reason: a newer commit already exists on `main`"
            echo "- Stale Web CI SHA: `$FRONTEND_REF`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
